---
name: Package stable release

# yamllint disable-line rule:truthy
on:
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      release-version:
        description: Stable GitHub Release tag to publish
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: >-
    release-linux-${{
      inputs.release-version || github.event.release.tag_name
    }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish Linux packages
    if: >-
      github.event_name == 'workflow_dispatch' ||
      !github.event.release.prerelease
    permissions:
      contents: write
      id-token: write
      attestations: write
    uses: timmo001/workflows/.github/workflows/release-bun-cli-linux.yml@2fb8b15d5e72caaea35cc5e4541733d87ef66002 # 20261008.0
    with:
      binary-name: home-assistant-tui
      package-name: home-assistant-tui
      entrypoint: src/index.ts
      package-config: .scripts/linux/nfpm.yaml
      bun-version: 1.4.2
      smoke-test-arguments: --help
      package-prepare-command: |-
        mkdir -p .scripts/linux/completions
        executable=./dist/release/root/home-assistant-tui
        completions=.scripts/linux/completions
        "$executable" completions bash > "$completions/home-assistant-tui.bash"
        "$executable" completions fish > "$completions/home-assistant-tui.fish"
        "$executable" completions zsh > "$completions/_home-assistant-tui"
      release-version: >-
        ${{ inputs.release-version || github.event.release.tag_name }}
      source-ref: >-
        ${{ inputs.release-version || github.event.release.tag_name }}
      existing-release: true
      attest: true

  prepare-arch-bin:
    name: Prepare Arch package (home-assistant-tui-bin)
    needs: release
    runs-on: ubuntu-latest
    env:
      RELEASE_VERSION: >-
        ${{ inputs.release-version || github.event.release.tag_name }}
    steps:
      - name: Check out release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          ref: ${{ env.RELEASE_VERSION }}

      - name: Render PKGBUILD
        uses: timmo001/workflows/.github/actions/prepare-arch-bin@2fb8b15d5e72caaea35cc5e4541733d87ef66002 # 20261008.0
        with:
          releaseVersion: ${{ env.RELEASE_VERSION }}
          packageName: home-assistant-tui
          pkgbuildTemplate: .scripts/linux/PKGBUILD.bin
          outputDirectory: ${{ runner.temp }}/arch-bin
          completionsArguments: "completions {shell}"
          extraFiles: LICENSE

      - name: Upload package files
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: >-
            arch-home-assistant-tui-bin-${{
              github.run_id
            }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/arch-bin
          if-no-files-found: error
          retention-days: 1

  arch-bin:
    name: Arch package (home-assistant-tui-bin)
    needs: prepare-arch-bin
    # yamllint disable-line rule:line-length rule:comments
    uses: timmo001/workflows/.github/workflows/build-arch-package.yml@2fb8b15d5e72caaea35cc5e4541733d87ef66002 # 20261008.0
    with:
      package-name: home-assistant-tui-bin
      # yamllint disable-line rule:line-length
      package-files-artifact-name: arch-home-assistant-tui-bin-${{ github.run_id }}-${{ github.run_attempt }}
      pkgbuild-path: PKGBUILD
    secrets:
      ARCH_REPO_DISPATCH_TOKEN: ${{ secrets.ARCH_REPO_DISPATCH_TOKEN }}

  attach-arch-bin:
    name: Attach Arch package (home-assistant-tui-bin)
    needs: arch-bin
    permissions:
      contents: write
      id-token: write
      attestations: write
    # yamllint disable-line rule:line-length rule:comments
    uses: timmo001/workflows/.github/workflows/attach-release-arch-package.yml@2fb8b15d5e72caaea35cc5e4541733d87ef66002 # 20261008.0
    with:
      artifact-name: ${{ needs.arch-bin.outputs.artifact-name }}
      release-tag: >-
        ${{ inputs.release-version || github.event.release.tag_name }}
      package-name: home-assistant-tui-bin

  publish-aur:
    name: Publish AUR (home-assistant-tui-bin)
    needs: prepare-arch-bin
    uses: timmo001/workflows/.github/workflows/publish-aur.yml@2fb8b15d5e72caaea35cc5e4541733d87ef66002 # 20261008.0
    with:
      package-name: home-assistant-tui-bin
      artifact-name: >-
        arch-home-assistant-tui-bin-${{
          github.run_id
        }}-${{ github.run_attempt }}
      auxiliary-file-paths: |-
        home-assistant-tui.bash
        home-assistant-tui.fish
        _home-assistant-tui
        LICENSE
    secrets:
      AUR_SSH_PRIVATE_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
