---
name: Publish Arch git package

# yamllint disable-line rule:truthy
on:
  push:
    branches:
      - main
    paths:
      - src/**
      - package.json
      - bun.lock
      - LICENSE
      - .scripts/linux/PKGBUILD
      - .github/workflows/publish-arch-git.yml
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: publish-arch-git-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish Arch package (home-assistant-tui-git)
    # yamllint disable-line rule:line-length
    uses: timmo001/workflows/.github/workflows/build-arch-package.yml@9c2c4f9290a765457128b962c64f15e5cc72e70c  # master
    with:
      package-name: home-assistant-tui-git
    secrets:
      ARCH_REPO_DISPATCH_TOKEN: ${{ secrets.ARCH_REPO_DISPATCH_TOKEN }}
