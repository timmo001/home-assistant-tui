---
name: Lint general

# yamllint disable-line rule:truthy
on:
  pull_request: {}
  push:
    branches:
      - main
  workflow_dispatch: {}

jobs:
  actionlint:
    uses: timmo001/workflows/.github/workflows/lint-actionlint.yml@f8d0daf26e163f0ee997d759fbf0f7daeb598c43 # 20261008.2

  markdownlint:
    uses: timmo001/workflows/.github/workflows/lint-markdownlint.yml@f8d0daf26e163f0ee997d759fbf0f7daeb598c43 # 20261008.2

  yamllint:
    uses: timmo001/workflows/.github/workflows/lint-yamllint.yml@f8d0daf26e163f0ee997d759fbf0f7daeb598c43 # 20261008.2

  jsonlint:
    uses: timmo001/workflows/.github/workflows/lint-jsonlint.yml@f8d0daf26e163f0ee997d759fbf0f7daeb598c43 # 20261008.2

  markdown-links:
    uses: timmo001/workflows/.github/workflows/lint-markdown-links.yml@f8d0daf26e163f0ee997d759fbf0f7daeb598c43 # 20261008.2

  shellcheck:
    uses: timmo001/workflows/.github/workflows/lint-shellcheck.yml@f8d0daf26e163f0ee997d759fbf0f7daeb598c43 # 20261008.2
    with:
      scandir: ./.scripts
      severity: warning
