---
name: Update AUR Package

# yamllint disable-line rule:truthy
on:
  push:
    branches:
      - main
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  prepare-aur:
    name: Prepare AUR package (home-assistant-tui-git)
    runs-on: ubuntu-latest
    if: >-
      ${{ github.ref == 'refs/heads/main'
      && (github.event_name == 'push'
      || github.event_name == 'workflow_dispatch') }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Test build
        run: |
          echo "Testing build to ensure it compiles..."
          bun install --frozen-lockfile
          bun run build

      - name: Prepare AUR package files
        run: .scripts/linux/prepare-aur.sh "${{ runner.temp }}/aur-package"

      - name: Upload AUR package files
        uses: >-  # v7
          actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: >-
            ha-tui-aur-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/aur-package
          if-no-files-found: error
          retention-days: 1

  update-aur:
    name: Update AUR (home-assistant-tui-git)
    needs: prepare-aur
    if: >-
      ${{ github.ref == 'refs/heads/main'
      && (github.event_name == 'push'
      || github.event_name == 'workflow_dispatch') }}
    permissions:
      contents: read
    uses: >-  # master
      timmo001/workflows/.github/workflows/publish-aur.yml@b1d37bf9247fadf3209395cd6bdcbd55c9989370
    with:
      package-name: home-assistant-tui-git
      artifact-name: >-
        ha-tui-aur-${{ github.run_id }}-${{ github.run_attempt }}
      pkgbuild-path: PKGBUILD
    secrets:
      AUR_SSH_PRIVATE_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
