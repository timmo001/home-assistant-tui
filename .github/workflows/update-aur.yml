---
name: Update AUR Package

# yamllint disable-line rule:truthy
on:
  push:
    branches:
      - main
  workflow_dispatch: {}

jobs:
  update-aur:
    name: Update AUR (home-assistant-tui-git)
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/timmo001/system-bridge/ci-build-arch:latest
    if: >-
      ${{ github.ref == 'refs/heads/main'
      && (github.event_name == 'push'
      || github.event_name == 'workflow_dispatch') }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Test build
        run: |
          echo "Testing build to ensure it compiles..."

          # Fix git ownership for VCS stamping in container
          git config --global --add safe.directory "$(pwd)"

          bun install --frozen-lockfile
          bun run build

      - name: Update AUR package
        env:
          AUR_SSH_PRIVATE_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_WORKSPACE: ${{ github.workspace }}
        run: |
          chmod +x .scripts/linux/update-aur.sh

          # If running as root and builduser exists, switch to builduser
          if [ "$(id -u)" -eq 0 ] && id -u builduser >/dev/null 2>&1; then
            echo "Running as root, switching to builduser..."
            chown -R builduser:builduser "$(pwd)"
            exec sudo \
            --preserve-env=CI,AUR_SSH_PRIVATE_KEY,GITHUB_SHA,GITHUB_WORKSPACE \
            -u builduser -H bash ./.scripts/linux/update-aur.sh
          fi

          .scripts/linux/update-aur.sh
